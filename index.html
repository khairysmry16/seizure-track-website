<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motivation & Progress Tracker</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #cce5ff, #e6f7ff);
      color: #333;
      overflow-x: hidden;
    }

    header {
      background: #007bff;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 1.8em;
      letter-spacing: 1px;
    }

    .motto {
      text-align: center;
      margin: 40px 0;
      font-size: 1.5em;
      animation: fadeInOut 5s infinite alternate;
      color: #004085;
    }

    @keyframes fadeInOut {
      0% { opacity: 0.3; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(-5px); }
    }

    .results {
      width: 100vw;
      height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    iframe {
      width: 95%;
      height: 90%;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    footer {
      background: #007bff;
      color: white;
      text-align: center;
      padding: 15px 0;
      font-size: 1em;
    }

    footer p {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <header>
    Progress Tracker Dashboard
  </header>

  <div class="motto">
    <p>🌟 You are not different, you are special 🌟</p>
    <p>💙 إنت مش مختلف، إنت مميز 💙</p>
  </div>

  <section class="results">
    <iframe 
      src="https://docs.google.com/spreadsheets/d/1jTM7E0reqS-xdKfbkhiMNSLWz5VQXJzqVobOpqvg-44/preview">
    </iframe>
  </section>

  <footer>
    <p>📞 Khairy Mohamed — +20 115 165 5495</p>
    <p>📞 Ahmed Hesham — +20 102 403 6859</p>
  </footer>
</body>
</html>
